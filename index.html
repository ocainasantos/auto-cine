<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="carrossel-wrapper container">
        <div class="carrossel">
            <div id="carrossel-slides"></div>
            <div class="carrossel__controls">
                <div class="carrossel__dots" id="carrossel-dots"></div>
                <div class="carrossel__nav">
                    <button type="button" id="carrossel-prev">&lt;</button>
                    <button type="button" id="carrossel-next">&gt;</button>
                </div>
            </div>
        </div>
    </section>

    <main class="catalogo">
        <div class="catalogo__inner container" data-catalogo></div>
    </main>

    <script src="js/comum.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
